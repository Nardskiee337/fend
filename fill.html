<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student & Staff Registration | University of Cabuyao</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: #edf4fa;
            font-family: Arial, sans-serif;
            color: #243b53;
        }

        .navbar {
            background: linear-gradient(110deg, #102a43, #176b87);
        }

        .navbar-brand {
            color: white;
            font-weight: bold;
        }

        .registration-card {
            max-width: 650px;
            margin: 50px auto;
            border: none;
            border-radius: 12px;
            overflow: hidden;
        }

        .card-header {
            background: #176b87;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .form-label {
            font-weight: 600;
        }

        .btn-register {
            background: #176b87;
            color: white;
            padding: 12px;
        }

        .btn-register:hover {
            background: #102a43;
            color: white;
        }

        footer {
            background: #102a43;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="#home">
                    <img src="uni.png" alt="University Logo" width="45" height="45">
                    <span>SCHOOL BORROW</span>
                </a>
            <a href="index.html" class="btn btn-outline-light btn-sm">
                Back to Home
            </a>
        </div>
    </nav>

    <main class="container">
        <div class="card registration-card shadow">

            <div class="card-header">
                <h3>Registration Form</h3>
                <p class="mb-0">School Inventory Management System</p>
            </div>

            <div class="card-body p-4">

                <form id="registrationForm">

                    <div class="mb-3">
                        <label for="userType" class="form-label">Register As</label>
                        <select class="form-select" id="userType" required>
                            <option value="">Choose user type</option>
                            <option value="Admin">Admin</option>
                            <option value="Staff">Staff</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="fullName" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="fullName"
                            placeholder="Enter your full name" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email"
                            placeholder="Enter your email" required>
                    </div>

                    <button type="submit" class="btn btn-register w-100">
                        Register Now
                    </button>

                    <div id="message" class="mt-3 text-center" role="status"></div>

                </form>

            </div>
        </div>
    </main>

    <footer>
        <p class="mb-0">&copy; 2026 SCHOOL BORROW | School Inventory Management System</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
